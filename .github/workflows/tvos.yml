name: tvOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Mixer tests, Web Audio tests and the LittleJS example in the API simulator.
  littlejs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: extractions/setup-just@v2
      - run: node tools/ejecta-sim/wasm/sources.mjs --check
      - run: just test
      - run: just littlejs-example
      - run: just check 6

  # Compiles the Ejecta-TV target for the tvOS Simulator (no signing).
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: xcodebuild -version
      # Report every compile error in one run, not just the first file's
      - run: defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
      - run: just littlejs-example
      - run: just build-sim
